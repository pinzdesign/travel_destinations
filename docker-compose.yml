services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_destinations_flask

    depends_on:
      - mariadb

    ports:
      - "8000:8000"

    environment:
      DB_HOST: mariadb
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: travel_destinations

    networks:
      - travel_network

  mariadb:
    image: mariadb:10.6.20
    container_name: travel_destinations_mariadb

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: travel_destinations

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - travel_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: travel_destinations_phpmyadmin

    depends_on:
      - mariadb

    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "8080:80"

    networks:
      - travel_network


volumes:
  mariadb_data:
    name: travel_destinations_data


networks:
  travel_network:
    name: travel_destinations_network
    driver: bridge